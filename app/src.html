<title>Trailpost HK</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
/*LEAFLET_CSS*/
:root{
  --ink:#15241d;--ink2:#3a4c43;--muted:#66766e;--paper:#eef1ec;--card:#ffffff;--line:#d6ddd7;--line2:#e6ebe7;
  --accent:#b8660f;--accent-ink:#ffffff;--focus:#1f6fa8;
  --sea:#c9dfe8;--land:#f3f3ec;--park:#d3e6cc;--parkline:#9cc193;--res:#a9cde0;
  --go:#2d7a4b;--go-bg:#e3f1e8;--warn:#a86a07;--warn-bg:#fbf0db;--bad:#b0342a;--bad-bg:#f9e3e0;
  --gmb:#1f7a45;--rmb:#b8322a;
  --shadow:0 1px 2px rgba(20,36,29,.06),0 4px 14px rgba(20,36,29,.06);
  --f-disp:"Barlow Condensed","Arial Narrow","Noto Sans HK",sans-serif;
  --f-body:"Noto Sans HK","Helvetica Neue",Arial,"PingFang HK","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ink:#e4ebe6;--ink2:#bccac1;--muted:#8d9d94;--paper:#0f1612;--card:#17211b;--line:#2b3a31;--line2:#223029;
  --accent:#e0913a;--accent-ink:#1a1206;--focus:#6fb2e3;
  --sea:#0f2330;--land:#1c2621;--park:#1f3526;--parkline:#335a3e;--res:#1b4258;
  --go:#6cc793;--go-bg:#15311f;--warn:#e7b34e;--warn-bg:#35280d;--bad:#f07f73;--bad-bg:#3a1714;
  --gmb:#5fc28a;--rmb:#f07f73;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
  --ink:#e4ebe6;--ink2:#bccac1;--muted:#8d9d94;--paper:#0f1612;--card:#17211b;--line:#2b3a31;--line2:#223029;
  --accent:#e0913a;--accent-ink:#1a1206;--focus:#6fb2e3;
  --sea:#0f2330;--land:#1c2621;--park:#1f3526;--parkline:#335a3e;--res:#1b4258;
  --go:#6cc793;--go-bg:#15311f;--warn:#e7b34e;--warn-bg:#35280d;--bad:#f07f73;--bad-bg:#3a1714;
  --gmb:#5fc28a;--rmb:#f07f73;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{padding:10px 16px 0;background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:500}
.brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.brand b .post{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 5px 1px;margin-left:2px;font-size:20px;vertical-align:3px}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:transparent;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.days{display:flex;gap:6px;margin:10px 0 0;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 10px;cursor:pointer;text-align:left;min-width:88px}
.day small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.day strong{font-family:var(--f-disp);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.main{min-height:0;display:grid;grid-template-columns:1fr}
.pane{min-height:0;overflow-y:auto;padding:14px 16px 24px}
.mapwrap{min-height:0;position:relative;background:var(--sea)}
#map{position:absolute;inset:0;background:var(--sea)}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px 10px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.tabs button.sos[aria-pressed="true"]{color:var(--bad)}
.mode-list .mapwrap{display:none}.mode-map .pane{display:none}
.deskTabs{display:none}
@media (min-width:960px){
  .main{grid-template-columns:minmax(420px,470px) 1fr}
  .mode-list .mapwrap,.mode-map .mapwrap{display:block}.mode-map .pane{display:block}
  .tabs{display:none}
  .app{grid-template-rows:auto 1fr}
  .pane{border-right:1px solid var(--line)}
  .deskTabs{display:flex;gap:6px;margin-bottom:12px}
}
.deskTabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}
.deskTabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.deskTabs button.sos[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}

/* conditions */
.cond{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:8px}
.cond h2{margin:0;font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.condrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--paper)}
.wchip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.wchip.y i{background:#e0b000}.wchip.r i{background:#d23c2f}.wchip.b i{background:#111}.wchip.a i{background:#e08a00}.wchip.g i{background:var(--muted)}
.wx{font-size:14px;color:var(--ink2)}
.wx strong{font-family:var(--f-disp);font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.stale{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:5px 9px}
.meta{font-size:12px;color:var(--muted)}
.whatif{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.whatif select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 6px;color:var(--ink);max-width:100%}
.linkbtn{border:0;background:none;padding:0;color:var(--focus);cursor:pointer;text-decoration:underline;font-size:13px}

/* filters */
.main>*,.app>*{min-width:0}
.filters{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip i{width:10px;height:3px;border-radius:2px;display:inline-block}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.summary{font-size:13px;color:var(--muted);margin:8px 0 2px;display:flex;gap:12px;flex-wrap:wrap}
.summary b{font-variant-numeric:tabular-nums}

/* trail groups */
.group{margin-top:18px}
.ghead{display:grid;gap:6px;margin-bottom:6px}
.gtitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.gtitle h3{margin:0;font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1.05;text-wrap:balance}
.gtitle h3 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.gtitle span{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.strip{display:flex;gap:2px;height:22px}
.strip button{border:0;padding:0;cursor:pointer;border-radius:3px;position:relative;min-width:14px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:#fff}
.strip button.l0{background:var(--go)}.strip button.l1{background:var(--warn)}.strip button.l2{background:var(--bad)}
:root[data-theme="dark"] .strip button{color:#0f1612}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .strip button{color:#0f1612}}
.rows{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line2);background:transparent;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--paper)}
.num{font-family:var(--f-disp);font-weight:700;font-size:20px;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-variant-numeric:tabular-nums}
.rtitle{font-weight:500;font-size:14.5px;line-height:1.3}
.rsub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px;font-variant-numeric:tabular-nums}
.rwhy{font-size:12.5px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p0{color:var(--go);background:var(--go-bg)}.p1{color:var(--warn);background:var(--warn-bg)}.p2{color:var(--bad);background:var(--bad-bg)}
.stars{letter-spacing:1px;color:var(--accent);font-size:11px}

/* detail */
.back{border:0;background:none;padding:4px 0;cursor:pointer;color:var(--muted);font-size:14px;display:inline-flex;gap:4px;align-items:center}
.dhead{margin:6px 0 10px}
.eyebrow{font-family:var(--f-disp);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.eyebrow i{width:14px;height:4px;border-radius:2px}
.dhead h2{margin:2px 0 0;font-family:var(--f-disp);font-size:32px;line-height:1.02;font-weight:700;text-wrap:balance}
.verdict{border-radius:12px;padding:12px 14px;display:grid;gap:6px;border:1px solid transparent}
.verdict.v0{background:var(--go-bg);border-color:color-mix(in srgb,var(--go) 30%,transparent)}
.verdict.v1{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.verdict.v2{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.verdict .vt{font-family:var(--f-disp);font-size:22px;font-weight:700;line-height:1.1}
.v0 .vt{color:var(--go)}.v1 .vt{color:var(--warn)}.v2 .vt{color:var(--bad)}
.verdict ul{margin:0;padding-left:18px;font-size:14px}
.verdict li{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.stat{background:var(--card);padding:8px 10px}
.stat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:14px;color:var(--muted);margin-left:2px;font-family:var(--f-body);font-weight:400}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-family:var(--f-disp);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prof{width:100%;height:auto;display:block}
.prof text{font-family:var(--f-mono);font-size:13px;fill:var(--muted)}
.prof .pt{fill:var(--accent);font-weight:600}
.tr{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.tr:first-child{border-top:0;padding-top:0}.tr:last-child{padding-bottom:0}
.mode{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;border-radius:8px;padding:3px 6px;border:1.5px solid var(--ink2);line-height:1.05}
.mode small{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mode b{font-family:var(--f-disp);font-size:19px;font-weight:700;text-align:center;max-width:92px;overflow-wrap:anywhere}
.mode.gmb{border-color:var(--gmb)}.mode.gmb b{color:var(--gmb)}
.mode.rmb{border-color:var(--rmb)}.mode.rmb b{color:var(--rmb)}
.tr .from{font-weight:500;font-size:14px}
.tr .note{font-size:13px;color:var(--ink2)}
.kv{display:grid;gap:10px}
.kv div{font-size:14px}
.kv b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.kv ul{margin:2px 0 0;padding-left:18px}
.postrange{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.pc{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--ink);color:var(--paper);padding:1px 7px;border-radius:5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sources{font-size:12.5px;color:var(--muted);display:grid;gap:2px;overflow-wrap:anywhere}
.hl{display:flex;flex-wrap:wrap;gap:6px}
.hl span{font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 8px}

/* SOS */
.sosTop{background:var(--bad);color:#fff;border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.sosTop .n{font-family:var(--f-disp);font-size:54px;font-weight:700;line-height:.95;letter-spacing:.02em}
.sosTop p{margin:0;font-size:14px}
.lookup{display:flex;gap:8px;margin-top:14px}
.lookup input{flex:1;min-width:0;font-family:var(--f-mono);font-size:26px;font-weight:600;text-transform:uppercase;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);letter-spacing:.08em}
.post3d{display:flex;gap:12px;align-items:center}
.postIcon{width:52px;flex:none}
.script{font-size:15px;background:var(--paper);border-radius:10px;padding:10px 12px;border:1px dashed var(--line)}
.script p{margin:0 0 6px}.script p:last-child{margin:0}
.hint{font-size:13px;color:var(--muted)}
.tips{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.examples button{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 8px;cursor:pointer}

/* map bits */
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-tooltip.postlbl{background:var(--ink);color:var(--paper);border:0;box-shadow:none;font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:0 4px;border-radius:3px}
.leaflet-tooltip.postlbl:before{display:none}
.leaflet-tooltip.rlbl{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:12px;box-shadow:var(--shadow)}
.leaflet-tooltip.plbl{background:transparent;border:0;box-shadow:none;color:var(--muted);font-family:var(--f-disp);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0}
.leaflet-tooltip.plbl:before{display:none}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-bar a{background:var(--card);color:var(--ink);border-color:var(--line)}
.maplegend{position:absolute;left:10px;bottom:22px;z-index:450;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;display:grid;gap:3px;box-shadow:var(--shadow)}
.maplegend div{display:flex;gap:6px;align-items:center}
.maplegend i{width:16px;height:4px;border-radius:2px;display:inline-block}
.maplegend i.park{height:10px;background:var(--park);border:1px solid var(--parkline)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:999px;font-size:13px;z-index:900}

.v3d{position:fixed;inset:0;z-index:1000;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.v3dBar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.v3dBar h2{margin:0;font-family:var(--f-disp);font-size:24px;font-weight:700}
.v3dBar button{border:1px solid var(--line);background:var(--card);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
.v3dCanvas{position:relative;min-height:0;background:#bcd9ec;overflow:hidden}
.v3dCanvas canvas{display:block;width:100%;height:100%;touch-action:none}
.v3dMsg{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:#15241d;padding:16px;text-align:center}
.v3dFlyInfo{position:absolute;left:12px;top:12px;background:rgba(21,36,29,.82);color:#fff;border-radius:8px;padding:3px 9px;font-family:var(--f-mono);font-size:12.5px}
.v3dFlyInfo:empty{display:none}
.v3dFlyInfo{max-width:calc(100% - 24px);line-height:1.45}
.v3dWalkUI{position:absolute;left:12px;right:12px;bottom:44px;max-width:620px;background:rgba(21,36,29,.84);color:#fff;border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.v3dWalkUI[hidden]{display:none}
.v3dWalkRow2{justify-content:flex-start}.v3dWalkRow2 .btn[hidden]{display:none}
.v3dWalkCard{position:absolute;left:50%;transform:translateX(-50%);top:62px;width:min(440px,calc(100% - 24px));background:rgba(255,255,255,.94);color:#15241d;border-radius:12px;padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:grid;gap:2px;font-size:13.5px;line-height:1.35}
.v3dWalkCard[hidden]{display:none}.v3dWalkCard b{font-weight:700}.v3dWalkCard em{font-style:normal;color:#b8660f;margin-right:4px}.v3dWalkCard span{color:#3a4c43}
.v3dProf{position:relative}.v3dProf svg{display:block;width:100%;height:38px}
.v3dProf span{position:absolute;right:4px;font-size:10.5px;font-family:var(--f-mono);opacity:.75}#v3dWalkHi{top:0}#v3dWalkLo{bottom:0}
.v3dWalkRow{display:flex;gap:8px;align-items:center}.v3dWalkRow input{flex:1;min-width:60px;accent-color:#ffb36b}
.v3d.walking #v3dCloudInfo,.v3d.walking #v3dSrc,.v3d.walking .v3dRow.sun{display:none}
@media (min-width:960px){.v3dWalkUI{left:auto;right:16px;bottom:48px;width:min(560px,calc(100% - 480px))}}
.v3dWalkRow .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);padding:5px 10px;font-size:13px;white-space:nowrap}
.v3dMsg[hidden],.v3d[hidden],.lb[hidden]{display:none}
.cloudrow{display:grid;gap:6px;border-top:1px solid var(--line2);padding-top:8px}
.peaks{display:flex;flex-wrap:wrap;gap:5px}
.pk{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--paper)}
.pk i{width:8px;height:8px;border-radius:50%}.pk.ok i{background:var(--go)}.pk.pt i{background:var(--warn)}.pk.in i{background:var(--muted)}
.lb{position:fixed;inset:0;z-index:1200;background:rgba(10,16,13,.72);display:grid;place-items:center;padding:16px}

<script>
(function(){
const D=window.HK_ROUTES, BASE=window.HK_BASE;
let COND=window.HK_COND;
const ROUTES=D.routes, TRAILS=D.trails;
const byId=Object.fromEntries(ROUTES.map(r=>[r.id,r]));
const trailById=Object.fromEntries(TRAILS.map(t=>[t.id,t]));
const DAYCOLOR='#8a6d1f';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('tp_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('tp_'+k,JSON.stringify(v))}catch(e){}}};

const S={lang:store.get('lang','en'),day:null,filter:store.get('filter','all'),view:'list',sel:null,tab:'list',whatif:[],post:'',lastPost:null};
const ZH=()=>S.lang==='zh';
const T=(en,zh)=>ZH()?zh:en;
const F=(o,k)=>o?(ZH()?(o[k+'_zh']??o[k+'_en']):(o[k+'_en']??o[k+'_zh'])):'';

/* ---------- time helpers (Hong Kong, UTC+8, no DST) ---------- */
function hkNow(){const d=new Date();return new Date(d.getTime()+ (8*60+d.getTimezoneOffset())*60000);}
function sunTimes(y,m,d){ // returns {rise,set} minutes after local midnight, HK
  const lat=22.3,lon=114.17,zenith=90.833,rad=Math.PI/180;
  const N=Math.floor(275*m/9)-Math.floor((m+9)/12)*(1+Math.floor((y-4*Math.floor(y/4)+2)/3))+d-30;
  function calc(rising){
    const lngHour=lon/15, t=N+((rising?6:18)-lngHour)/24;
    const M=0.9856*t-3.289;
    let Lx=M+1.916*Math.sin(M*rad)+0.020*Math.sin(2*M*rad)+282.634;Lx=(Lx+360)%360;
    let RA=Math.atan(0.91764*Math.tan(Lx*rad))/rad;RA=(RA+360)%360;
    RA=RA+(Math.floor(Lx/90)*90-Math.floor(RA/90)*90);RA/=15;
    const sinDec=0.39782*Math.sin(Lx*rad),cosDec=Math.cos(Math.asin(sinDec));
    const cosH=(Math.cos(zenith*rad)-sinDec*Math.sin(lat*rad))/(cosDec*Math.cos(lat*rad));
    let H=rising?360-Math.acos(cosH)/rad:Math.acos(cosH)/rad;H/=15;
    const Tt=H+RA-0.06571*t-6.622;let UT=(Tt-lngHour+24)%24;
    return Math.round(((UT+8)%24)*60);
  }
  return {rise:calc(true),set:calc(false)};
}
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

/* ---------- HKO warnings ---------- */
const WNAME={
 WFIREY:['Yellow fire danger','黃色火災危險警告','y'],WFIRER:['Red fire danger','紅色火災危險警告','r'],
 WFROST:['Frost warning','霜凍警告','g'],WHOT:['Very hot weather','酷熱天氣警告','r'],WCOLD:['Cold weather','寒冷天氣警告','g'],
 WMSGNL:['Strong monsoon signal','強烈季候風信號','g'],WRAINA:['Amber rainstorm','黃色暴雨警告','a'],WRAINR:['Red rainstorm','紅色暴雨警告','r'],
 WRAINB:['Black rainstorm','黑色暴雨警告','b'],WL:['Landslip warning','山泥傾瀉警告','a'],WTS:['Thunderstorm warning','雷暴警告','y'],
 WTMW:['Tsunami warning','海嘯警告','r'],TC1:['Typhoon signal No. 1','一號戒備信號','g'],TC3:['Strong wind signal No. 3','三號強風信號','b'],
 TC8NE:['Gale signal No. 8 NE','八號東北烈風或暴風信號','b'],TC8SE:['Gale signal No. 8 SE','八號東南烈風或暴風信號','b'],
 TC8NW:['Gale signal No. 8 NW','八號西北烈風或暴風信號','b'],TC8SW:['Gale signal No. 8 SW','八號西南烈風或暴風信號','b'],
 TC9:['Storm signal No. 9','九號烈風或暴風風力增強信號','b'],TC10:['Hurricane signal No. 10','十號颶風信號','b']
};
const wLabel=c=>WNAME[c]?T(WNAME[c][0],WNAME[c][1]):c;

/* ---------- planning context ---------- */
function dayList(){
  const now=hkNow();const out=[{i:0,now:true,date:now}];
  (COND.forecast||[]).forEach((f,k)=>{const y=+f.date.slice(0,4),m=+f.date.slice(4,6),d=+f.date.slice(6,8);out.push({i:k+1,now:false,date:new Date(y,m-1,d),f})});
  // keep forecast days that are today or later
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return out.filter(x=>x.now||x.date>=today).slice(0,4);
}
function ctx(){
  const days=dayList();const day=days.find(x=>x.i===S.day)||days[0];
  const d=day.date;const st=sunTimes(d.getFullYear(),d.getMonth()+1,d.getDate());
  const now=hkNow();
  const warnings=day.now?[...(COND.warnings||[]),...S.whatif]:[...S.whatif];
  const hktemp=(COND.temps||{})['Hong Kong Observatory'];
  const maxT=day.now?Math.max(hktemp||0,...Object.values(COND.temps||{}).map(Number).filter(Number.isFinite)):day.f.max;
  return {day,cloud:cloudFor(day),warnings:[...new Set(warnings)],maxT,psr:day.now?null:day.f.psr,sunset:st.set,sunrise:st.rise,nowMin:day.now?now.getHours()*60+now.getMinutes():null};
}

/* ---------- safety engine ---------- */
function evaluate(r,c){
  const R=[];const add=(lvl,en,zh)=>R.push({lvl,en,zh});
  const W=new Set(c.warnings);const has=(...k)=>k.some(x=>W.has(x));
  const hours=r.hours||2,stars=r.stars||2;
  if(has('TC3','TC8NE','TC8SE','TC8NW','TC8SW','TC9','TC10')) add(2,'Typhoon signal No. 3 or higher: stay off the hills. Country park facilities close and transport stops.','三號或以上熱帶氣旋警告信號：切勿上山。郊野公園設施關閉，交通或會停駛。');
  else if(has('TC1')){ if(r.ferry) add(2,'Typhoon signal No. 1: ferries and kaitos may stop without much notice.','一號戒備信號：渡輪及街渡或會隨時停航。'); else if(r.exposed&&hours>=3) add(2,'Typhoon signal No. 1 and a long exposed route: winds can rise fast and signals can go up.','一號戒備信號，路線長而開揚：風勢可急速增強，信號或會提升。'); else add(1,'Typhoon signal No. 1 in force: keep it short and check for higher signals.','一號戒備信號生效：宜選短線，留意信號會否提升。');}
  if(has('WRAINB','WRAINR')) add(2,'Red or black rainstorm: flash floods and landslides. Do not start.','紅色或黑色暴雨警告：山洪及山泥傾瀉風險，切勿出發。');
  else if(has('WRAINA')) add(stars>=4?2:1,'Amber rainstorm: streams rise fast and steps get slippery.','黃色暴雨警告：溪水急漲，石級濕滑。');
  if(has('WL')) add(2,'Landslip warning: slopes may fail. Avoid hill trails.','山泥傾瀉警告：斜坡隨時塌下，避免上山。');
  if(has('WTS')) add(r.exposed?2:1,r.exposed?'Thunderstorm warning and an exposed ridge or peak: lightning risk.':'Thunderstorm warning: have a way down and stay off open ground.',r.exposed?'雷暴警告，路線有開揚山脊或山頂：有雷擊危險。':'雷暴警告：預留撤退路線，避開空曠地方。');
  if(has('WTMW')&&r.coastal) add(2,'Tsunami warning: stay away from the shore.','海嘯警告：遠離海岸。');
  if(has('WMSGNL')&&(r.ferry||r.exposed)) add(1,r.ferry?'Strong monsoon: rough seas, ferries and kaitos may be cancelled.':'Strong monsoon: strong gusts on open ridges.',r.ferry?'強烈季候風：海面大浪，渡輪及街渡或取消。':'強烈季候風：開揚山脊陣風強勁。');
  if(has('WFIRER')) add(1,'Red fire danger: extreme hill-fire risk. No fires, no smoking; watch for smoke.','紅色火災危險警告：山火風險極高。切勿生火或吸煙，留意煙霧。');
  if(has('WFROST','WCOLD')&&(r.max_ele||0)>=500) add(1,'Cold or frost: high ground can be icy and near freezing.','寒冷或霜凍：高地可能結冰，氣溫接近冰點。');
  // heat
  const hot=has('WHOT')||(c.maxT!=null&&c.maxT>=33);
  if(hot){
    const t=c.maxT;const very=t>=35;
    if(r.exposed&&r.nowater&&hours>=4) add(2,`Very hot (${t}°C), little shade and no water for ${hours} h. Heat stroke risk is high.`,`酷熱（${t}°C），少遮蔭而${hours}小時無補給，中暑風險高。`);
    else if(very&&r.exposed&&hours>=3) add(2,`${t}°C forecast on an exposed ${hours} h route. Heat stroke risk is high.`,`預測${t}°C，路線開揚需時${hours}小時，中暑風險高。`);
    else if(r.exposed||hours>=3) add(1,`Very hot (${t}°C)${r.exposed?' with little shade':''}. Start early and carry extra water.`,`酷熱（${t}°C）${r.exposed?'，少遮蔭':''}。宜早出發，多帶食水。`);
  }
  if(c.psr&&/high/i.test(c.psr)&&stars>=(/medium/i.test(c.psr)?4:3)) add(1,`Rain likely (${c.psr} chance): slippery rock and stream crossings.`,`有雨機會${psrZh(c.psr)}：岩石濕滑，溪澗難過。`);
  const cc=cloudCheck(r,c.cloud);
  if(cc&&cc.kind==='in') add((r.exposed||stars>=3)?1:-1,`Cloud down to about ${cc.base} m${c.cloud.src==='taf'?' is forecast':''}: the top of this route (${r.max_ele} m) will likely be in cloud. Little view, wet rock, harder to see the path.`,`${c.cloud.src==='taf'?'預測':''}雲底低至約${cc.base}米：路線最高點（${r.max_ele}米）很可能在雲中，視野差、岩石濕滑、較難看清山徑。`);
  else if(cc&&cc.kind==='patches') R.push({lvl:-1,en:`Some cloud around ${cc.base} m: passing cloud may cover the higher parts.`,zh:`約${cc.base}米有零散雲，較高路段或會有雲飄過。`});
  if(r.notice) add(1,'Part of the route or a nearby path is closed. Follow the diversion signs.','路段或附近路徑部分封閉，請按指示繞道。');
  // daylight
  const need=Math.round(hours*60*1.15);
  if(c.nowMin!=null){
    if(c.nowMin>c.sunset||c.nowMin<c.sunrise-30) add(stars>=4?2:1,`It is dark (sunset was ${hm(c.sunset)}). Only with a headtorch and on paths you know.`,`天色已黑（日落${hm(c.sunset)}）。只宜帶頭燈並走熟悉路線。`);
    else if(c.nowMin+need>c.sunset) add(1,`Starting now you would finish after sunset (${hm(c.sunset)}).`,`現在出發會在日落（${hm(c.sunset)}）後才完成。`);
  }
  if(has('WFIREY')&&!has('WFIRER')) R.push({lvl:-1,en:'Yellow fire danger: no fires outside BBQ sites.',zh:'黃色火災危險警告：燒烤場以外切勿生火。'});
  const lvl=Math.max(0,...R.map(x=>x.lvl));
  const water=Math.max(1,Math.ceil(hours*(hot?0.8:0.5)*2)/2);
  const latest=c.sunset-need-30;
  R.sort((a,b)=>b.lvl-a.lvl);
  return {lvl,reasons:R,water,latest,need};
}
function psrZh(p){return ({'High':'高','Medium High':'中高','Medium':'中','Medium Low':'中低','Low':'低'})[p]||p}
const LVL=[['Good to go','適合出發'],['Go with care','小心出發'],['Avoid today','今日不宜']];
const LVs=[['Go','適合'],['Care','小心'],['Avoid','不宜']];

/* ---------- names ---------- */
function trailName(r){if(r.kind==='day')return T('Day hike','一日遊');const t=trailById[r.trail];return F(t,'name');}
function rTitle(r){if(r.kind==='day')return F(r,'name');return `${F(r,'start')} → ${F(r,'end')}`}
function rLabel(r){return r.kind==='day'?F(r,'name'):`${trailName(r)} ${T('Stage ','第')}${r.n}${T('','段')}`}
function rColor(r){return r.kind==='day'?DAYCOLOR:trailById[r.trail].color}
const starStr=n=>'★'.repeat(n)+'☆'.repeat(Math.max(0,5-n));
const diffName=n=>T(['','Easy','Moderate','Demanding','Difficult','Very difficult'][n],['','容易','普通','費力','難行','非常難行'][n]);

/* ---------- posts index ---------- */
const POSTS={};
ROUTES.forEach(r=>(r.post_list||[]).forEach(p=>{(POSTS[p[0]]=POSTS[p[0]]||[]).push({code:p[0],lat:p[1],lon:p[2],km:p[3],interp:!!p[4],r})}));

/* ---------- conditions from db (newer than the embedded snapshot) ---------- */
const DBP=(async()=>{try{if(!window.claude||!window.claude.use)return null;return await window.claude.use('db')}catch(e){return null}})();
(async()=>{try{const db=await DBP;if(!db)return;
  const snap=await db.doc('conditions/current').get();if(snap&&snap.exists){const d=snap.data();if(d&&d.fetchedAt&&(!COND.fetchedAt||d.fetchedAt>COND.fetchedAt)){COND=d;render();if(typeof V!=='undefined'&&V.loaded){buildClouds();relabel();render3DChrome()}}}}catch(e){}})();
let CAMS=null;
async function loadCams(){if(CAMS)return CAMS;try{const db=await DBP;if(!db)return null;const s=await db.doc('conditions/cams').get();if(s&&s.exists){CAMS=s.data();return CAMS}}catch(e){}return null}
const COVN={FEW:['a few clouds','少量雲'],SCT:['scattered cloud','疏雲'],BKN:['mostly cloudy','多雲'],OVC:['overcast','密雲'],VV:['fog or very low cloud','霧或極低雲']};
function cloudFor(day){ // cloud layers for the planning day: airport observation now, airport forecast (TAF) for tomorrow
  const cl=COND.cloud;if(!cl)return null;
  if(day.now)return {layers:cl.layers||[],src:'obs',time:cl.obsTime};
  const d=day.date;const t0=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),0)/1000,t1=t0+10*3600;// 08:00-18:00 HKT = 00-10 UTC
  const gs=(cl.taf||[]).filter(g=>g.from<t1&&g.to>t0);if(!gs.length)return null;
  const layers=[];gs.forEach(g=>(g.clouds||[]).forEach(c=>layers.push(c)));return {layers,src:'taf'};
}
function cloudCheck(r,cf){ // lowest heavy cloud base vs the route's highest point
  if(!cf||!r.max_ele)return null;const ls=cf.layers.slice().sort((a,b)=>a.base_m-b.base_m);
  const heavy=ls.find(l=>l.frac>=0.75&&l.base_m<r.max_ele),light=ls.find(l=>l.base_m<r.max_ele);
  return heavy?{kind:'in',base:heavy.base_m}:light?{kind:'patches',base:light.base_m}:null;
}
function openCams(focus){
  const lb=$('#lb');lb.hidden=false;const box=$('#lbBody');box.innerHTML=`<p class="hint">${T('Loading camera photos…','正在載入相片…')}</p>`;
  loadCams().then(c=>{if(!c||!c.cams||!c.cams.length){box.innerHTML=`<p>${T('Camera photos are not available right now.','暫時未能提供相片。')}</p>`;return}
    const list=focus?c.cams.slice().sort((a,b)=>(b.id===focus)-(a.id===focus)):c.cams;
    box.innerHTML=list.map(k=>`<figure><img src="${k.img}" alt="${esc(T(k.en,k.zh))}"><figcaption>${esc(T(k.en,k.zh))}</figcaption></figure>`).join('')+`<p class="meta">${T('Photos: Hong Kong Observatory. Updated','相片：香港天文台。更新時間')} ${new Date(c.fetchedAt).toLocaleString(ZH()?'zh-HK':'en-GB',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short',timeZone:'Asia/Hong_Kong'})}</p>`});
}

function condCard(c){
  const d=c.day;let h='';
  const ageH=(Date.now()-new Date(COND.fetchedAt).getTime())/3.6e6;
  if(d.now){
    const ws=c.warnings;
    h+=`<div class="condrow">${ws.length?ws.map(w=>`<span class="wchip ${WNAME[w]?WNAME[w][2]:'g'}"><i></i>${esc(wLabel(w))}${S.whatif.includes(w)?T(' (preview)','（模擬）'):''}</span>`).join(''):`<span class="wchip g"><i></i>${T('No warnings in force','現時沒有警告')}</span>`}</div>`;
    const t=(COND.temps||{})['Hong Kong Observatory'];
    h+=`<div class="wx"><strong>${t??'–'}°C</strong>${T('at the Observatory','天文台')} · ${T('humidity','濕度')} ${COND.humidity??'–'}% · ${T('sunset','日落')} ${hm(c.sunset)}</div>`;
    h+=`<div class="wx">${esc(ZH()?COND.today_zh:COND.today_en)}</div>`;
    h+=cloudBlock(c);
  }else{
    const f=d.f;
    h+=`<div class="wx"><strong>${f.min}–${f.max}°C</strong>${T('rain chance','降雨機會')} ${esc(ZH()?psrZh(f.psr):f.psr)} · ${T('sunset','日落')} ${hm(c.sunset)}</div>`;
    h+=`<div class="wx">${esc(ZH()?f.wx_zh:f.wx_en)} ${esc(ZH()?f.wind_zh:f.wind_en)}</div>`;
    h+=cloudBlock(c);
    if(S.whatif.length) h+=`<div class="condrow">${S.whatif.map(w=>`<span class="wchip ${WNAME[w][2]}"><i></i>${esc(wLabel(w))}${T(' (preview)','（模擬）')}</span>`).join('')}</div>`;
    h+=`<div class="meta">${T('Warnings are issued at short notice. Check again on the morning.','警告可隨時發出，出發當日早上請再查看。')}</div>`;
  }
  if(ageH>3) h+=`<div class="stale">${T(`Weather data is ${Math.round(ageH)} h old. Check the Observatory before you go.`,`天氣資料已是${Math.round(ageH)}小時前，出發前請查閱天文台。`)}</div>`;
  const opts=Object.keys(WNAME).filter(k=>!c.warnings.includes(k)).map(k=>`<option value="${k}">${esc(wLabel(k))}</option>`).join('');
  h+=`<div class="whatif"><label for="wi">${T('Preview a warning:','模擬警告：')}</label><select id="wi"><option value="">${T('choose…','選擇…')}</option>${opts}</select>${S.whatif.length?`<button class="linkbtn" id="wiclear" type="button">${T('Clear preview','清除模擬')}</button>`:''}</div>`;
  const when=new Date(COND.fetchedAt);
  h+=`<div class="meta">${T('Hong Kong Observatory data','香港天文台資料')} · ${T('updated','更新')} ${when.toLocaleString(ZH()?'zh-HK':'en-GB',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short',timeZone:'Asia/Hong_Kong'})} · <a href="https://www.hko.gov.hk/${ZH()?'tc':'en'}/wxinfo/dailywx/wxwarntoday.htm" target="_blank" rel="noopener">${T('Warnings now','最新警告')}</a></div>`;
  return `<section class="cond" aria-label="${T('Conditions','天氣情況')}"><h2>${d.now?T('Conditions now','現時天氣'):T('Forecast','天氣預測')}</h2>${h}</section>`;
}
function cloudBlock(c){
  const cf=c.cloud;if(!cf)return '';const ls=cf.layers.slice().sort((a,b)=>a.base_m-b.base_m).filter(l=>l.base_m<2500);
  const desc=ls.length?ls.map(l=>`${T(...(COVN[l.cover]||[l.cover,l.cover]))} ${T('at','於')} ${l.base_m} m`).join(T(', ','，')):T('no low cloud reported','沒有低雲');
  const when=cf.time?new Date(cf.time).toLocaleTimeString(ZH()?'zh-HK':'en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Hong_Kong'}):'';
  let h=`<div class="cloudrow"><div class="wx"><b>${T('Clouds','雲況')}:</b> ${esc(desc)} <span class="meta">(${cf.src==='obs'?T(`airport report ${when}`,`機場報告 ${when}`):T('airport forecast, daytime','機場預測，日間')})</span></div>`;
  if(cf.src==='obs'&&COND.cloud.peaks){const ST={clear:['clear','無雲','ok'],patches:['passing cloud','零散雲','pt'],in:['in cloud','雲中','in']};
    h+=`<div class="peaks">${COND.cloud.peaks.map(p=>{const s=ST[p.status]||ST.clear;return `<span class="pk ${s[2]}" title="${p.m} m"><i></i>${esc(T(p.en,p.zh))} · ${T(s[0],s[1])}</span>`}).join('')}</div>
    <div><button class="linkbtn" type="button" id="camsBtn">${T('See the hills now: live camera photos','即時相片：看看山上情況')}</button></div>`}
  return h+'</div>';
}

}

  }
  h+=`<p class="meta" style="margin-top:18px">${T('Routes, times, difficulty and distance posts from AFCD (hiking.gov.hk). Map from OpenStreetMap. Transport checked Sept 2026; always check before travel.','路線、時間、難度及標距柱資料來自漁護署「郊野樂行」。地圖來自OpenStreetMap。交通資料於2026年9月核對，出發前請再查閱。')}</p>`;

  <circle cx="${x(imax)}" cy="${y(p[imax])}" r="3.5" fill="${rColor(r)}"/><text x="${Math.min(W-40,x(imax)+6)}" y="${y(p[imax])-5}" style="fill:var(--ink);font-weight:600">${p[imax]} m</text>
  <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${pk}

  (r.segs||[]).forEach(seg=>{if(!seg.length)return;selLayer.addLayer(L.polyline(seg,{color:css('--card'),weight:10,opacity:.95,interactive:false}));selLayer.addLayer(L.polyline(seg,{color:rColor(r),weight:5.5,opacity:1,interactive:false}))});
  const s0=r.segs&&r.segs[0]&&r.segs[0][0],sl=r.segs&&r.segs.length&&r.segs[r.segs.length-1];const s1=sl&&sl[sl.length-1];
  if(s0)selLayer.addLayer(L.circleMarker(s0,{radius:7,color:css('--ink'),weight:2.5,fillColor:'#2d7a4b',fillOpacity:1}).bindTooltip(T('Start','起點')+': '+esc(F(r,'start')||F(r,'name')),{className:'rlbl'}));
  if(s1)selLayer.addLayer(L.circleMarker(s1,{radius:7,color:css('--ink'),weight:2.5,fillColor:'#b0342a',fillOpacity:1}).bindTooltip(T('End','終點')+': '+esc(F(r,'end')||F(r,'name')),{className:'rlbl'}));
  selLayer.addTo(map);
  postLayer=L.layerGroup();
  (r.post_list||[]).forEach(p=>{const m=L.circleMarker([p[1],p[2]],{radius:3.5,color:css('--ink'),weight:1.5,fillColor:css('--card'),fillOpacity:1,interactive:false});m._code=p[0];postLayer.addLayer(m)});
  postLayer.addTo(map);updatePostLabels();
}
function updatePostLabels(){
  if(!postLayer||!map)return;const z=map.getZoom();
  postLayer.eachLayer(m=>{const n=+m._code.slice(1);const show=z>=15||(z>=14&&n%2===0)||(z>=13&&n%4===0);
    if(show&&!m.getTooltip())m.bindTooltip(m._code,{permanent:true,direction:'right',offset:[4,0],className:'postlbl'});
    if(!show&&m.getTooltip())m.unbindTooltip();});
}
function focusRoute(r){if(!map)return;map.invalidateSize();drawSelected(r);const all=(r.segs||[]).flat();if(all.length)map.fitBounds(L.latLngBounds(all),{padding:[30,30],maxZoom:15});else if(r.pin)map.setView(r.pin,14)}
function showPost(p){
  if(!map)return;if(hiPost)map.removeLayer(hiPost);
  drawSelected(p.r);
  hiPost=L.layerGroup([L.circleMarker([p.lat,p.lon],{radius:16,color:css('--bad'),weight:3,fill:false,interactive:false}),L.circleMarker([p.lat,p.lon],{radius:6,color:css('--bad'),weight:2,fillColor:css('--bad'),fillOpacity:1}).bindTooltip(p.code,{permanent:true,direction:'top',offset:[0,-10],className:'postlbl'})]).addTo(map);
  map.invalidateSize();map.setView([p.lat,p.lon],15);
}
// restyle map on theme change
const reTheme=()=>{if(map)drawMap(true)};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',reTheme)}catch(e){}
new MutationObserver(reTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

$('#lbX').onclick=()=>{$('#lb').hidden=true};$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').hidden=true});
/*V3D*/
document.documentElement.lang=ZH()?'zh-HK':'en';
if(location.hash==='#sos'){S.view='sos'}
if(location.hash==='#lantau3d'){setTimeout(()=>open3D('lantau-3'),0)}
render();initMap();
})();
</script>
